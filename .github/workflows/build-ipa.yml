name: Build IPA from your own Spotify IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct link to a decrypted Spotify IPA"
        required: true
        type: string
      upload_method:
        description: "Where to put the result"
        default: artifacts
        type: choice
        options: [artifacts, filebin, both]

env:
  THEOS: ${{ github.workspace }}/theos

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: levibostian/action-hide-sensitive-inputs@v1

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v5
        with:
          repository: theos/theos
          ref: master
          path: theos
          submodules: recursive
          fetch-depth: 1

      - name: Install tools
        run: |
          brew install make dpkg ldid
          python3 -m pip install --break-system-packages git+https://github.com/asdfzxcvbn/pyzule-rw.git

      - name: Download IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p ipa
          download_ok() { head -c 2 ipa/spotify.ipa | grep -qz $'PK'; }

          if [[ "$IPA_URL" == *"/releases/download/"* ]]; then
            TAG="${IPA_URL#*/releases/download/}"; TAG="${TAG%%/*}"
            FILE="${IPA_URL##*/}"
            ASSET_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq ".assets[] | select(.name==\"${FILE}\") | .id")"
            gh api "repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" -H "Accept: application/octet-stream" > ipa/spotify.ipa
          else
            curl -fsSL -L --retry 3 --retry-delay 5 "$IPA_URL" -o ipa/spotify.ipa
          fi

          if ! download_ok; then
            echo "::warning::First download was not a zip; retrying with full redirect chain"
            curl -fsSL -L --retry 3 "$IPA_URL" -o ipa/spotify.ipa
          fi
          ls -la ipa/
          download_ok || { echo "::error::Download is not a zip/IPA (link may be expired or blocked)"; exit 1; }

      - run: make release

      - uses: actions/upload-artifact@v5
        if: inputs.upload_method != 'filebin'
        with:
          name: spoti.ipa
          path: out/*.ipa
          if-no-files-found: error

      - name: Upload to filebin.net
        if: inputs.upload_method != 'artifacts'
        run: |
          BIN="spotifyglass-${{ github.run_id }}"
          echo "### filebin.net download" >> "$GITHUB_STEP_SUMMARY"
          for f in out/*.ipa; do
            curl -fsS -X POST -H "Content-Type: application/octet-stream" --data-binary "@$f" "https://filebin.net/$BIN/$(basename "$f")" >/dev/null
            echo "- https://filebin.net/$BIN/$(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "- _filebin deletes bins after a few days of inactivity, download promptly._" >> "$GITHUB_STEP_SUMMARY"
